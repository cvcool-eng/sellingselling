<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SellingSelling</title>
  <link rel="icon" href="icon.svg?v=32" type="image/svg+xml">
  <link rel="icon" href="icon-32.png?v=32" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=32">
  <meta property="og:image" content="icon-512.png?v=32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=32">
</head>
<body>
  <canvas id="world"></canvas>

  <div id="hud-top">
    <div class="title sketch">SellingSelling</div>
    <div class="hud-right">
      <div id="money" class="pill sketch"><span class="coin-slot" data-art-slot="fishcoin"></span> <span id="moneyVal">0</span></div>
      <div id="luck" class="pill small sketch">🍀 Luck <span id="luckVal">+0%</span></div>
      <div id="clock" class="pill small sketch"><span class="clock-ic"></span> <span id="clockVal">Day</span></div>
    </div>
  </div>

  <button id="navShop" class="nav-btn sketch">← Shop</button>
  <button id="navDock" class="nav-btn right sketch hidden">Dock →</button>
  <button id="leaveCabin" class="nav-btn sketch hidden">← Leave cabin</button>
  <div id="sleepFade"><span>Zzz...</span></div>

  <div id="hotbar" class="sketch">
    <div class="slot" id="slotRod"><span class="slot-label">Pole</span><canvas id="rodIcon" width="112" height="112"></canvas></div>
    <div class="slot" id="slotBait"><span class="slot-label">Bait</span><span class="slot-emoji" id="baitEmoji"></span><span class="slot-count" id="baitCount"></span></div>
    <div class="slot locked" data-acc><span class="slot-label">Accessory</span><span class="slot-emoji" data-art-slot="ring"></span><span class="lock">🔒</span></div>
    <div class="slot locked" data-acc><span class="slot-label">Accessory</span><span class="slot-emoji" data-art-slot="tophat"></span><span class="lock">🔒</span></div>
    <button id="backpack" aria-label="Backpack">
      <svg class="bag-svg" viewBox="0 0 64 64">
        <path d="M22 18 C22 5, 42 5, 42 18" fill="none" stroke="#1b1b1b" stroke-width="5" stroke-linecap="round"/>
        <path d="M22 18 C22 5, 42 5, 42 18" fill="none" stroke="#7a4b22" stroke-width="2" stroke-linecap="round"/>
        <rect x="9" y="17" width="46" height="43" rx="11" fill="#8b5a2b" stroke="#1b1b1b" stroke-width="3"/>
        <ellipse cx="32" cy="21" rx="19" ry="5" fill="#2e1c0b"/>
        <rect x="19" y="40" width="26" height="14" rx="4" fill="#74471f" stroke="#1b1b1b" stroke-width="2.5"/>
        <path d="M23 45 h18" stroke="#1b1b1b" stroke-width="1.5" stroke-dasharray="2 2.5"/>
        <g class="bag-flap">
          <path d="M9 23 Q9 16 16 16 H48 Q55 16 55 23 V31 Q32 41 9 31 Z" fill="#a8703a" stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round"/>
          <rect x="28" y="30" width="8" height="8" rx="2" fill="#f2c94c" stroke="#1b1b1b" stroke-width="2"/>
        </g>
      </svg>
      <span id="bagCount" class="badge hidden">0</span>
    </button>
  </div>

  <!-- Catch reveal -->
  <div id="reveal" class="hidden"></div>
  <div id="flash"></div>

  <!-- Shop -->
  <div id="shop" class="modal hidden">
    <div class="panel">
      <div class="panel-head">
        <h2>🏪 The Shop</h2>
        <div class="pill small sketch"><span class="coin-slot" data-art-slot="fishcoin"></span> <span class="moneyMirror">0</span></div>
        <button class="close sketch" data-close>✕</button>
      </div>
      <div class="panel-body" id="shopBody"></div>
      <div class="shop-tabs">
        <button class="tab sketch" data-tab="sell">Sell</button>
        <button class="tab sketch" data-tab="rods">Fishing Poles</button>
        <button class="tab sketch" data-tab="bait">Bait</button>
      </div>
    </div>
  </div>

  <!-- Backpack -->
  <div id="bag" class="modal hidden">
    <div class="panel">
      <div class="panel-head">
        <h2>🎒 Backpack</h2>
        <button class="close sketch" data-close>✕</button>
      </div>
      <div class="panel-body" id="bagBody"></div>
    </div>
  </div>

  <!-- Rod workbench (cabin table) -->
  <div id="merge" class="modal hidden">
    <div class="panel">
      <div class="panel-head">
        <h2>Rod Workbench</h2>
        <div class="pill small sketch"><span class="coin-slot" data-art-slot="fishcoin"></span> <span class="moneyMirror">0</span></div>
        <button class="close sketch" data-close>✕</button>
      </div>
      <div class="panel-body" id="mergeBody"></div>
    </div>
  </div>

  <!-- Property for sale -->
  <div id="property" class="modal hidden">
    <div class="panel small-panel">
      <div class="panel-head">
        <h2>Property</h2>
        <button class="close sketch" data-close>✕</button>
      </div>
      <div class="panel-body" id="propertyBody"></div>
    </div>
  </div>

  <!-- Traveling merchant -->
  <div id="merchant" class="modal hidden">
    <div class="panel">
      <div class="panel-head">
        <h2>Traveling Merchant</h2>
        <div class="pill small sketch"><span class="coin-slot" data-art-slot="fishcoin"></span> <span class="moneyMirror">0</span></div>
        <button class="close sketch" data-close>✕</button>
      </div>
      <div class="panel-body" id="merchantBody"></div>
    </div>
  </div>

  <div id="toast" class="sketch"></div>

  <!-- Title / loading screen -->
  <div id="title"><canvas id="titleCanvas"></canvas></div>

  <script src="data.js?v=32"></script>
  <script src="items-art.js?v=32"></script>
  <script src="game.js?v=32"></script>
  <script src="title.js?v=32"></script>
</body>
</html>
